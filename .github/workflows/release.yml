name: Release

# Push a version tag to publish a release, e.g.:
#   git tag v0.2.0 && git push origin v0.2.0
# The tag must match "version" in src-tauri/tauri.conf.json.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release and upload the installers

jobs:
  release:
    name: Build signed installers and publish
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the app version
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in src-tauri/tauri.conf.json"
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # rust-toolchain.toml pins the exact Rust version.
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: bun install --frozen-lockfile

      # Builds the MSI + NSIS installers, signs the update files with the private key,
      # creates the release and uploads latest.json, which installed copies of Fyn
      # read from releases/latest/download/latest.json to find updates.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: bun tauri
          args: --config src-tauri/tauri.release.conf.json
          tagName: ${{ github.ref_name }}
          releaseName: Fyn ${{ github.ref_name }}
          releaseBody: Download **Fyn_*_x64-setup.exe** below and run it. Installed copies update themselves.
          releaseDraft: false
          prerelease: false
