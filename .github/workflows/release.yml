name: Release

# Push a version tag to publish a release, e.g.:
#   git tag v0.2.0 && git push origin v0.2.0
# The tag must match "version" in src-tauri/tauri.conf.json.
on:
  push:
    tags: ["v*"]

# Every action is pinned to an exact commit (version in the comment): this job holds the
# update-signing key, so a moved tag upstream must not be able to change what runs here.

permissions:
  contents: write # create the GitHub release and upload the installers

jobs:
  release:
    name: Build signed installers and publish
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the tag matches the app version
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in src-tauri/tauri.conf.json"
            exit 1
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.3

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # rust-toolchain.toml pins the exact Rust version.
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - run: bun install --frozen-lockfile

      # Builds the MSI + NSIS installers, signs the update files with the private key,
      # creates the release and uploads latest.json, which installed copies of Fyn
      # read from releases/latest/download/latest.json to find updates.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: bun tauri
          args: --config src-tauri/tauri.release.conf.json
          tagName: ${{ github.ref_name }}
          releaseName: Fyn ${{ github.ref_name }}
          releaseBody: Download **Fyn_*_x64-setup.exe** below and run it. Installed copies update themselves.
          releaseDraft: false
          prerelease: false
